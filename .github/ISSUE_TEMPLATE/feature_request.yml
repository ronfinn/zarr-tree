name: Feature request
description: Suggest something zarr-tree should be able to do.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Worth checking first:
        [docs/status.md](https://github.com/ronfinn/zarr-tree/blob/master/docs/status.md)
        for what already exists and what is deliberately absent, and
        [docs/roadmap.md](https://github.com/ronfinn/zarr-tree/blob/master/docs/roadmap.md)
        for what is already intended.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you were trying to do, and what got in the way.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
      description: What zarr-tree would do instead.
    validations:
      required: true

  - type: input
    id: area
    attributes:
      label: Relevant format or backend
      placeholder: "Zarr V3, OME-Zarr HCS, SpatialData tables, S3, HTTP, --json"
    validations:
      required: false

  - type: textarea
    id: example
    attributes:
      label: Example
      description: The metadata this would read, or the output you would want to see.
      render: text
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and workarounds
      description: What you do today instead, and why it is not enough.
    validations:
      required: false
