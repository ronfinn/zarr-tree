name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

  msrv:
    name: MSRV
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # The MSRV this crate claims in Cargo.toml. It is not edition 2024's own
      # 1.85: object_store uses let-chains, stable for edition 2024 from 1.88.
      - name: Install Rust 1.88.0
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # --locked so the committed Cargo.lock is what gets checked, not whatever
      # a fresh resolve would pick.
      - name: Check
        run: cargo check --locked
