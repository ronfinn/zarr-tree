[package]
name = "zarr-tree"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "A small CLI for exploring the structure and metadata of Zarr stores, locally, on S3 or over HTTP."
license = "MIT"
repository = "https://github.com/ronfinn/zarr-tree"

[dependencies]
# `aws` and `http` are the only backends enabled -- no GCS, no Azure --  and
# `default-features` is off so that object_store's own local-filesystem backend
# is left out: local stores are read with `std::fs`, as they always have been.
# `http` costs no extra crates; everything it needs, `aws` already pulled in.
object_store = { version = "0.14.1", default-features = false, features = ["aws", "http"] }
serde_json = "1.0.151"
# object_store is async throughout, so a runtime is needed to drive it. A
# current-thread one is enough: `net` and `time` are what its HTTP client needs
# from the reactor, and nothing here wants a thread pool.
tokio = { version = "1.53.1", default-features = false, features = ["rt", "net", "time"] }
# Splitting an http(s) URI into the origin object_store wants as a base URL and
# the path that becomes the key prefix. Already in the tree behind object_store,
# and doing it by hand is how URL escaping gets broken.
url = "2.5"
